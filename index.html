    <meta property="og:title" content="QR Dinâmico - Gerador e Gerenciador de QR Codes Reutilizáveis" />
    <meta property="og:description" content="Crie e gerencie QR Codes dinâmicos com destino e senhas editáveis a qualquer momento sem precisar reimprimir. Inclui painel de controle, gestão de clientes e acesso Dev." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="text/javascript">
      // GitHub Pages SPA route restoration
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
